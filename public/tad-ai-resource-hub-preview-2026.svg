      <stop offset=".55" stop-color="#00efad" stop-opacity=".035"/>
      <stop offset="1" stop-color="#00efad" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#00efad" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#depth)"/>
