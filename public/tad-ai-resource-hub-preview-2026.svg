<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TAD AI Resource Hub</title>
  <desc id="desc">A clean social preview for the TAD AI Resource Hub with verified tools, creative workflows, and critical resources.</desc>
  <defs>
